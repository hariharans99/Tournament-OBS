<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Tournament Live Scoreboard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet"/>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      font-family: 'Rajdhani', sans-serif;
    }

    /* ── Main Scoreboard Panel (Right Side) ────────────────────────── */
    #scorePanel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      transform: translateX(100vw);
      opacity: 0;
      background: url('/media/scoreboard_bg.png') no-repeat;
      background-size: 100% 100%;
      background-position: center;
      pointer-events: none;
      display: block;
      overflow: hidden;
    }

    /* ── Inner content container aligned over the panel graphic ── */
    .panel-content {
      position: absolute;
      top: 6.94vh;
      left: 81.44vw;
      width: 16.60vw;
      height: 84.0vh;
      display: flex;
      flex-direction: column;
      overflow: visible;
    }

    /* ── Header ────────────────────────────────────────────────────── */
    #panelHeader {
      background: transparent;
      border-bottom: none;
      padding: 0;
      height: 6.94vh;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    #panelTitle {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.0vw;
      font-weight: 900;
      color: transparent; /* Text is baked into background graphic */
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    #liveIndicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7vw;
      font-weight: 700;
      color: transparent; /* Text is baked into background graphic */
      letter-spacing: 1px;
    }

    #liveDot {
      width: 0.5vw;
      height: 0.5vw;
      background: #ff8800;
      border-radius: 50%;
      box-shadow: 0 0 8px #ff8800;
      animation: pulse 1.5s infinite;
      margin-left: 9.3vw; /* Align over the orange dot on graphic */
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.8); }
    }

    /* ── Column Headers (Team | Kills | Alive) ──────────────── */
    /* Baked into background graphic — hidden to avoid doubling */
    #colHeaders {
      display: grid;
      grid-template-columns: 5.66vw 3.42vw 7.52vw;
      padding: 0;
      height: 4.51vh;
      align-items: center;
      border-bottom: none;
      background: transparent;
      flex-shrink: 0;
      visibility: hidden; /* TEAM/KILLS/ALIVE are baked into the background image */
    }

    .col-hdr {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8vw;
      font-weight: 700;
      color: #ffa040;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-align: center;
    }
    .col-hdr.name { text-align: left; }

    /* ── Overall Standings mode header overlay ───────────────── */
    /* Absolutely positioned over the graphic header bar for TOTAL | RANK labels */
    #standingsHeaders {
      position: absolute;
      top: 10.67vh;  /* panelHeader (6.94vh) + colHeaders starts within panel-content */
      left: 81.44vw;
      width: 16.60vw;
      height: 4.51vh;
      display: none;  /* Only visible in Overall Standings mode */
      grid-template-columns: 5.66vw 3.42vw 7.52vw;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }

    .standings-hdr {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8vw;
      font-weight: 700;
      color: #ffd700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-align: center;
    }
    .standings-hdr.name { text-align: left; color: #ffa040; }

    /* ── Team Rows Container ───────────────────────────────────────── */
    #teamList {
      overflow: hidden; /* Hide scrollbar since rows stretch/shrink to fit */
      flex-grow: 1;
      margin-top: 5.56vh; /* 32px vertical offset to align with first row of graphic */
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .team-row {
      display: grid;
      grid-template-columns: 5.66vw 3.42vw 7.52vw;
      flex: 1;
      max-height: 4.69vh; /* Exact 27px height per row maximum */
      min-height: 2.5vh; /* Shrink to fit many teams without congestion */
      padding: 0;
      align-items: center;
      border-bottom: none;
      transition: background 0.4s ease;
      position: relative;
    }

    .team-row:nth-child(odd) {
      background: transparent;
    }

    .team-row:nth-child(even) {
      background: transparent;
    }

    .team-row.eliminated {
      background: rgba(120, 0, 0, 0.22) !important;
    }

    .team-name-cell {
      font-size: 0.95vw;
      font-weight: 700;
      color: #eeeeee;
      letter-spacing: 0.4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding-left: 0.2vw;
    }

    .team-row.eliminated .team-name-cell {
      color: #ff5252;
      text-decoration: line-through;
      text-decoration-color: #ff1744;
    }

    .kills-cell, .points-cell, .alive-cell {
      font-size: 0.9vw;
      font-weight: 700;
      text-align: center;
      font-family: 'Orbitron', sans-serif;
      border-left: none;
      padding: 0;
    }

    .kills-cell {
      color: #ffc107;
      text-shadow: 0 0 6px rgba(255, 193, 7, 0.4);
    }

    .points-cell {
      color: #ffa040;
      text-shadow: 0 0 6px rgba(255, 160, 64, 0.4);
    }

    .alive-cell {
      color: #ffffff;
      letter-spacing: 1px;
      font-size: 0.85vw;
    }

    .alive-cell.zero {
      color: #ff1744;
      font-size: 0.85vw;
      letter-spacing: 1px;
      text-shadow: 0 0 8px rgba(255, 23, 68, 0.6);
    }

    /* ── Overall Standings specific cells ──────────────────── */
    .total-cell {
      font-size: 0.9vw;
      font-weight: 900;
      text-align: center;
      font-family: 'Orbitron', sans-serif;
      color: #ffd700; /* Gold for total points */
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
    }

    .rank-cell {
      font-size: 0.85vw;
      font-weight: 700;
      text-align: center;
      font-family: 'Orbitron', sans-serif;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .rank-cell.rank-top3 {
      color: #ffd700; /* Gold for top 3 */
      text-shadow: 0 0 6px rgba(255, 215, 0, 0.5);
    }

    #panelFooter {
      position: absolute;
      bottom: 4.3vh; /* Vertically centered inside the clean footer area of the graphic */
      left: 81.44vw;
      width: 16.60vw;
      height: 3.5vh;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: transparent;
      padding: 0 0.8vw; /* Pull text in from the gold borders */
      box-sizing: border-box; /* Include padding in the width calculation */
    }

    #aliveCountContainer, #elimCountContainer {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .footer-label {
      font-size: 0.68vw; /* Slightly smaller label to fit perfectly */
      font-weight: 700;
      color: #ffa040;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-family: 'Orbitron', sans-serif;
      display: flex;
      align-items: center;
    }

    .footer-icon {
      font-size: 0.75vw;
      margin-right: 3px;
      font-weight: bold;
    }

    #aliveCount {
      font-size: 0.85vw; /* Bold number */
      font-weight: 900;
      color: #ffa040;
      text-shadow: 0 0 8px rgba(255, 160, 64, 0.6);
      margin-left: 2px;
    }

    #elimCount {
      font-size: 0.85vw; /* Bold number */
      font-weight: 900;
      color: #ffa040;
      text-shadow: 0 0 8px rgba(255, 160, 64, 0.6);
      margin-left: 2px;
    }

    /* ── Elimination Centre Banner Popup ───────────────────────────── */
    #elimPopup {
      position: absolute;
      bottom: 12vh;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      opacity: 0;
      z-index: 999;
      pointer-events: none;
      width: 560px;
    }

    #elimPopupBox {
      width: 100%;
      height: 315px; /* 16:9 aspect ratio */
      background-image: url('/media/tournament_bg.jpg');
      background-size: cover;
      background-position: center;
      border: 3px solid #ff1744;
      box-shadow: 0 0 35px rgba(255, 23, 68, 0.8), inset 0 0 15px rgba(255, 23, 68, 0.3);
      border-radius: 12px;
      padding: 18px 40px;
      text-align: center;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #elimPopupBox::before {
      content: '';
      position: absolute;
      top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transform: skewX(-25deg);
      animation: popupShine 2s infinite;
    }

    @keyframes popupShine {
      0% { left: -100%; }
      60%, 100% { left: 200%; }
    }

    #elimPopupLabel {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8vw;
      font-weight: 700;
      color: #ff8a80;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    #elimPopupTeam {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.1vw;
      font-weight: 900;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 25px rgba(255, 255, 255, 0.6), 3px 3px 6px rgba(0,0,0,0.9);
    }

    #elimPopupSub {
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.95vw;
      font-weight: 700;
      color: #ffcdd2;
      margin-top: 6px;
      letter-spacing: 2px;
    }
  </style>

  <script>
    const DEFAULT_CSV_URL = "https://docs.google.com/spreadsheets/d/1Lm61yqAgFFZRIOQxlsK_27s7B77vtOiYk9g_Uq-EZ_8/edit?gid=1030597977#gid=1030597977";
    const REFRESH_MS      = 2000; // Poll Google Sheet every 2 seconds

    let rawCsvUrl    = '';
    let prevData     = {};    // Map of teamName -> { kills, alive }
    let refreshTimer = null;
    let popupQueue   = [];
    let popupBusy    = false;
    let isInitialized = false;
    let isRunning = false;

    function extractSheetId(url) {
      if (!url) return '';
      let match = url.match(/\/d\/(?!e\/)([a-zA-Z0-9-_]+)/);
      return match ? match[1] : '';
    }

    function extractGid(url) {
      if (!url) return '0';
      let match = url.match(/gid=([0-9]+)/);
      return match ? match[1] : '0';
    }

    function cleanGoogleSheetUrl(url) {
      if (!url) return DEFAULT_CSV_URL;
      url = url.trim();

      if (url.startsWith('<iframe') || url.includes('src=')) {
        let srcMatch = url.match(/src=["']([^"']+)["']/);
        if (srcMatch && srcMatch[1]) {
          url = srcMatch[1];
        }
      }

      url = url.replace(/&amp;/g, '&');

      if (url.includes('/pubhtml')) {
        let gidPart = extractGid(url);
        let basePart = url.split('/pubhtml')[0];
        return `${basePart}/pub?output=csv&gid=${gidPart}`;
      }

      return url;
    }

    function isValidTeamName(name) {
      if (!name || typeof name !== 'string') return false;
      let trimmed = name.replace(/^["']|["']$/g, '').trim();
      if (trimmed.length < 2 || trimmed.length > 40) return false;
      let lower = trimmed.toLowerCase();

      if (lower === 'teams' || lower === 'team name' || lower === 'teamname' || lower === 'team' || lower === 'status' || lower === 'kills' || lower === 'alive' || lower === 'position') return false;

      if (trimmed.includes('{') || trimmed.includes('}') || trimmed.includes('=') ||
          trimmed.includes(';') || trimmed.includes(':') || trimmed.includes('#') ||
          trimmed.includes('<') || trimmed.includes('>') || trimmed.includes('/') ||
          lower.includes('function') || lower.includes('deleteis') ||
          lower.includes('pageurl') || lower.includes('null') ||
          lower.includes('body') || lower.includes('visited') || lower.includes('return')) {
        return false;
      }

      return true;
    }

    function e(id) { return document.getElementById(id); }

    function update(data) {
      const d = typeof data === 'string' ? JSON.parse(data) : data;
      for (const k in d) {
        const el = document.getElementById(k);
        if (el) el.innerText = d[k] || '';
      }
      if (typeof runTemplateUpdate === 'function') runTemplateUpdate();
    }

    function play() {
      runTemplateUpdate();
    }
    function stop() { hidePanel(); }

    let currentMode = 'Live Match'; // Track scoreboard mode globally

    async function runTemplateUpdate() {
      // 1. Read mode from hidden div #f1
      let modeVal = e('f1') ? e('f1').innerText.trim() : 'Live Match';
      currentMode = modeVal || 'Live Match';

      // 2. Read rawCsvUrl from correct field based on mode
      let fieldVal = '';
      if (currentMode === 'Overall Standings') {
        fieldVal = e('f2') ? e('f2').innerText.trim() : '';
      } else {
        fieldVal = e('f0') ? e('f0').innerText.trim() : '';
      }
      rawCsvUrl = fieldVal || DEFAULT_CSV_URL;

      // 3. Toggle Overall Standings header overlay
      const standingsHdr = e('standingsHeaders');
      if (standingsHdr) {
        standingsHdr.style.display = (currentMode === 'Overall Standings') ? 'grid' : 'none';
      }

      if (isRunning) {
        await fetchAndRender(false);
        return;
      }
      isRunning = true;

      await fetchAndRender(true);
      isInitialized = true;
      showPanel();

      triggerNextPoll();
    }

    function triggerNextPoll() {
      if (!isRunning) return;
      refreshTimer = setTimeout(async () => {
        if (!isRunning) return;
        await fetchAndRender(false);
        triggerNextPoll();
      }, REFRESH_MS);
    }

    async function fetchAndRender(isFirstLoad) {
      try {
        let text = '';
        const targetCsvUrl = cleanGoogleSheetUrl(rawCsvUrl);
        let sheetId = extractSheetId(rawCsvUrl);
        let gid = extractGid(rawCsvUrl);
        
        // 1. Try DIRECT export URL first
        if (sheetId) {
          let exportUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=${gid}`;
          try {
            const proxyRes = await fetch('/api/fetchUrl?url=' + encodeURIComponent(exportUrl));
            if (proxyRes.ok) {
              let tempText = await proxyRes.text();
              if (tempText && !tempText.startsWith('<!DOCTYPE') && !tempText.startsWith('<html')) {
                text = tempText;
              }
            }
          } catch (errExport) {
            console.warn('Direct export fetch failed, falling back...', errExport);
          }
        }

        // 2. Fallback to Published URL
        if (!text) {
          try {
            const proxyRes = await fetch('/api/fetchUrl?url=' + encodeURIComponent(targetCsvUrl));
            if (proxyRes.ok) {
              text = await proxyRes.text();
            }
          } catch (errProxy) {
            console.warn('Proxy fetch warning:', errProxy);
          }
        }

        // 3. Fallback to Direct Fetch
        if (!text) {
          try {
            const directRes = await fetch(targetCsvUrl);
            if (directRes.ok) {
              text = await directRes.text();
            }
          } catch (errDirect) {
            console.warn('Direct fetch warning:', errDirect);
          }
        }

        if (!text || text.startsWith('<!DOCTYPE') || text.startsWith('<html')) {
          console.warn('Received HTML or empty text from CSV endpoint');
          return;
        }

        const rows = parseCSV(text);
        if (rows.length === 0) return;

        // Find the header row
        let headerRow = null;
        for (let row of rows) {
          if (!row || row.length < 2) continue;
          let hasTeam = row.some(cell => {
            let c = cell.toLowerCase().trim();
            return c === 'team' || c === 'teams' || c === 'team name';
          });
          if (hasTeam) { headerRow = row; break; }
        }

        const teams = [];

        if (currentMode === 'Overall Standings') {
          // ── Overall Standings mode: parse TotalPoints sheet ──────────────
          // Format: Team | Match1 Pts | Match2 Pts | ... | Total
          // We find the column named "total", "grand total", "sum", or use last column

          let teamColIdx = 0;
          let totalColIdx = -1;

          if (headerRow) {
            headerRow.forEach((cell, idx) => {
              let c = cell.toLowerCase().trim();
              if (c === 'team' || c === 'teams' || c === 'team name' || c === 'teamname') {
                teamColIdx = idx;
              }
              if (c === 'total' || c === 'grand total' || c === 'sum' || c === 'total points' || c === 'overall') {
                totalColIdx = idx;
              }
            });
            // If no Total column found by name, use the last column
            if (totalColIdx === -1) totalColIdx = headerRow.length - 1;
          } else {
            // No header row — col 0 = team, last col = total
            const sampleRow = rows.find(r => r && r.length > 1);
            if (sampleRow) totalColIdx = sampleRow.length - 1;
          }

          for (let row of rows) {
            if (!row || row.length < 2) continue;
            let nameCandidate = (row[teamColIdx] || '').trim();
            if (!isValidTeamName(nameCandidate)) continue;

            let totalVal = 0;
            if (row[totalColIdx] !== undefined && row[totalColIdx] !== '') {
              totalVal = parseInt(row[totalColIdx].trim(), 10);
              if (isNaN(totalVal)) totalVal = 0;
            }

            teams.push({ name: nameCandidate, alive: 1, kills: 0, points: totalVal });
          }

          // Sort by total descending then assign ranks
          teams.sort((a, b) => b.points - a.points);
          teams.forEach((t, idx) => { t.rank = idx + 1; });

        } else {
          // ── Live Match mode: parse match sheet ──────────────────────────
          let teamColIdx = 1, aliveColIdx = 2, killsColIdx = 3, pointsColIdx = 4;

          if (headerRow) {
            headerRow.forEach((cell, idx) => {
              let c = cell.toLowerCase().trim();
              if (c === 'team' || c === 'teams' || c === 'team name' || c === 'teamname') teamColIdx = idx;
              else if (c === 'alive' || c === 'status') aliveColIdx = idx;
              else if (c === 'kills' || c === 'kill') killsColIdx = idx;
              else if (c === 'points' || c === 'pts') pointsColIdx = idx;
            });
          }

          for (let row of rows) {
            if (!row || row.length <= Math.max(teamColIdx, killsColIdx)) continue;
            let nameCandidate = (row[teamColIdx] || '').trim();
            if (!isValidTeamName(nameCandidate)) continue;

            let aliveVal = 1;
            if (headerRow && headerRow.some(cell => cell.toLowerCase().trim() === 'alive' || cell.toLowerCase().trim() === 'status')) {
              aliveVal = 0;
              if (row[aliveColIdx] !== undefined) {
                let str = row[aliveColIdx].trim();
                let barCount = (str.match(/[▌█|]/g) || []).length;
                if (barCount > 0) aliveVal = barCount;
                else { let p = parseInt(str, 10); aliveVal = isNaN(p) ? 0 : p; }
              }
            }

            let killsVal = 0;
            if (row[killsColIdx] !== undefined && row[killsColIdx] !== '') {
              killsVal = parseInt(row[killsColIdx].trim(), 10);
              if (isNaN(killsVal)) killsVal = 0;
            }

            let pointsVal = 0;
            if (row[pointsColIdx] !== undefined && row[pointsColIdx] !== '') {
              pointsVal = parseInt(row[pointsColIdx].trim(), 10);
              if (isNaN(pointsVal)) pointsVal = 0;
            }

            teams.push({ name: nameCandidate, alive: aliveVal, kills: killsVal, points: pointsVal });
          }
        }

        if (teams.length === 0) return;

        if (isFirstLoad || e('teamList').children.length === 0) {
          buildTable(teams);
        } else {
          updateTable(teams);
        }

        updateFooter(teams);
        teams.forEach(t => { prevData[t.name] = { kills: t.kills, alive: t.alive, points: t.points }; });

      } catch (err) {
        console.error('Error fetching CSV:', err);
      }
    }

    function sortTeams(teams) {
      if (currentMode === 'Overall Standings') {
        teams.sort((a, b) => b.points - a.points);
        teams.forEach((t, idx) => { t.rank = idx + 1; });
      } else {
        teams.sort((a, b) => {
          let aAlive = a.alive > 0 ? 1 : 0;
          let bAlive = b.alive > 0 ? 1 : 0;
          if (aAlive !== bAlive) return bAlive - aAlive;
          if (b.points !== a.points) return b.points - a.points;
          return b.kills - a.kills;
        });
      }
    }

    function buildTable(teams) {
      const list = e('teamList');
      list.innerHTML = '';
      sortTeams(teams);

      teams.forEach((t, i) => {
        const row = document.createElement('div');
        const isOut = (t.alive === 0);
        row.className = 'team-row' + (isOut && currentMode === 'Live Match' ? ' eliminated' : '');
        row.id = 'row_' + safeid(t.name);

        let innerHtml = '';
        if (currentMode === 'Overall Standings') {
          const rankClass = t.rank <= 3 ? 'rank-cell rank-top3' : 'rank-cell';
          innerHtml = `
            <div class="team-name-cell" title="${t.name}">${t.name}</div>
            <div class="total-cell" id="kills_${safeid(t.name)}">${t.points}</div>
            <div class="${rankClass}" id="alive_${safeid(t.name)}">#${t.rank}</div>
          `;
        } else {
          let aliveSymbols = isOut ? 'OUT' : '▮'.repeat(t.alive);
          innerHtml = `
            <div class="team-name-cell" title="${t.name}">${t.name}</div>
            <div class="kills-cell" id="kills_${safeid(t.name)}">${t.kills}</div>
            <div class="alive-cell ${isOut ? 'zero' : ''}" id="alive_${safeid(t.name)}">${aliveSymbols}</div>
          `;
        }
        row.innerHTML = innerHtml;
        list.appendChild(row);

        anime({ targets: row, opacity: [0, 1], translateX: ['30px', '0px'], duration: 350, delay: i * 25, easing: 'easeOutCubic' });
      });
    }

    function updateTable(teams) {
      // Sort teams before comparison
      sortTeams(teams);

      teams.forEach(t => {
        const id   = safeid(t.name);
        const row  = e('row_' + id);
        if (!row) return;

        const prev = prevData[t.name] || { kills: t.kills, alive: t.alive, points: t.points };

        if (t.kills !== prev.kills) {
          animateNumber('kills_' + id, prev.kills, t.kills, '#ffcc00');
          flashRow(row, 'rgba(255, 204, 0, 0.2)');
        }

        if (currentMode === 'Overall Standings') {
          if (t.points !== prev.points) {
            animateNumber('alive_' + id, prev.points, t.points, '#00d4ff');
            flashRow(row, 'rgba(0, 212, 255, 0.2)');
          }
        } else {
          if (t.points !== prev.points) {
            animateNumber('points_' + id, prev.points, t.points, '#00d4ff');
            flashRow(row, 'rgba(0, 212, 255, 0.2)');
          }

          if (t.alive !== prev.alive) {
            const aliveEl = e('alive_' + id);
            if (t.alive === 0 && prev.alive > 0) {
              if (!row.classList.contains('eliminated')) {
                // Calculate placement: number of teams currently alive + 1
                let aliveCountAfter = teams.filter(x => x.alive > 0).length;
                let placement = aliveCountAfter + 1;
                t.placement = placement;

                markEliminated(row, id, t);
                popupQueue.push(t);
                drainPopupQueue();
              }
            } else {
              if (prev.alive === 0 && t.alive > 0) {
                row.classList.remove('eliminated');
                row.style.backgroundColor = '';
                if (aliveEl) aliveEl.className = 'alive-cell';
              }
              if (aliveEl) {
                aliveEl.innerText = '▮'.repeat(t.alive);
                anime({
                  targets: aliveEl,
                  scale: [1.3, 1],
                  duration: 400,
                  easing: 'easeOutBack'
                });
              }
              flashRow(row, 'rgba(0, 255, 136, 0.2)');
            }
          }
        }
      });

      // Reorder the DOM nodes smoothly to match the sorted order
      reorderDOM(teams);
    }

    function reorderDOM(teams) {
      const list = e('teamList');
      teams.forEach(t => {
        const row = e('row_' + safeid(t.name));
        if (row) {
          list.appendChild(row);
        }
      });
    }

    function markEliminated(row, id, t) {
      const aliveEl = e('alive_' + id);
      if (aliveEl) {
        aliveEl.className = 'alive-cell zero';
        aliveEl.innerText = 'OUT';
      }

      row.classList.add('eliminated');

      anime({
        targets: row,
        backgroundColor: ['rgba(255, 23, 68, 0.5)', 'rgba(180, 0, 0, 0.22)'],
        duration: 800,
        easing: 'easeOutCubic'
      });
    }

    function animateNumber(elemId, from, to, color) {
      const el = e(elemId);
      if (!el) return;
      const obj = { val: from };

      anime({
        targets: obj,
        val: to,
        duration: 600,
        easing: 'easeOutCubic',
        round: 1,
        update: () => { el.innerText = obj.val; }
      });

      anime({
        targets: el,
        scale: [1.35, 1],
        color: [color, null],
        duration: 500,
        easing: 'easeOutBack'
      });
    }

    function flashRow(row, color) {
      anime({
        targets: row,
        background: [color, 'rgba(0,0,0,0)'],
        duration: 1000,
        easing: 'easeOutCubic'
      });
    }

    function drainPopupQueue() {
      if (popupBusy || popupQueue.length === 0) return;
      popupBusy = true;
      const t = popupQueue.shift();
      showElimPopup(t, () => {
        popupBusy = false;
        drainPopupQueue();
      });
    }

    function showElimPopup(team, done) {
      e('elimPopupTeam').innerText = team.name.toUpperCase();
      e('elimPopupLabel').innerText = `ELIMINATED AT #${team.placement || '-'}`;
      e('elimPopupSub').innerText  = `TOTAL KILLS: ${team.kills}`;
      const pop = e('elimPopup');

      anime.timeline({ easing: 'easeOutElastic(1, 0.7)' })
        .add({
          targets: pop,
          translateX: ['-50%', '-50%'],
          translateY: ['80px', '0px'],
          opacity: [0, 1],
          duration: 750
        })
        .add({
          targets: '#elimPopupBox',
          scale: [0.85, 1],
          duration: 500
        }, '-=600')
        .add({
          targets: pop,
          opacity: [1, 0],
          translateY: ['0px', '40px'],
          duration: 600,
          easing: 'easeInCubic',
          delay: 4000
        })
        .finished.then(() => {
          pop.style.opacity = '0';
          done && done();
        });
    }

    // Update footer totals
    function updateFooter(teams) {
      if (currentMode === 'Overall Standings') {
        e('panelFooter').style.display = 'none';
        return;
      }
      e('panelFooter').style.display = 'flex';
      const alive = teams.filter(t => t.alive > 0).length;
      const elim  = teams.filter(t => t.alive === 0).length;
      e('aliveCount').innerText = alive;
      e('elimCount').innerText  = elim;
    }

    function showPanel() {
      anime({
        targets: '#scorePanel',
        translateX: ['120%', '0%'],
        opacity: [0, 1],
        duration: 700,
        easing: 'easeOutCubic'
      });
    }

    function hidePanel() {
      clearTimeout(refreshTimer);
      isRunning = false;
      isInitialized = false;
      anime({
        targets: '#scorePanel',
        translateX: ['0%', '120%'],
        opacity: [1, 0],
        duration: 500,
        easing: 'easeInCubic'
      });
    }

    function parseCSV(text) {
      return text.split(/\r\n|\n/).map(line => line.split(','));
    }

    function safeid(name) {
      return name.replace(/[^a-zA-Z0-9]/g, '_');
    }

    // Auto-initialize when loaded directly in browser/renderer
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        if (!isInitialized) runTemplateUpdate();
      }, 300);
    });

    window.SPXGCTemplateDefinition = {
      "description": "Tournament Live Scoreboard (Team | Kills | Alive)",
      "playserver": "OVERLAY",
      "playchannel": "1",
      "playlayer": "2",
      "webplayout": "2",
      "out": "manual",
      "DataFields": [
        {
          "field": "f0",
          "ftype": "textfield",
          "title": "Google Sheet CSV URL / Embed Code",
          "value": "https://docs.google.com/spreadsheets/d/1Lm61yqAgFFZRIOQxlsK_27s7B77vtOiYk9g_Uq-EZ_8/edit?gid=1030597977#gid=1030597977"
        },
        {
          "field": "f1",
          "ftype": "select",
          "title": "Scoreboard Mode",
          "value": "Live Match",
          "items": [
            {"value": "Live Match", "text": "Live Match"},
            {"value": "Overall Standings", "text": "Overall Standings"}
          ]
        },
        {
          "field": "f2",
          "ftype": "textfield",
          "title": "Overall Standings CSV URL / Embed Code",
          "value": "https://docs.google.com/spreadsheets/d/1Lm61yqAgFFZRIOQxlsK_27s7B77vtOiYk9g_Uq-EZ_8/edit?gid=1030597977#gid=1030597977"
        }
      ]
    };
  </script>
</head>
<body>

  <div id="f0" style="display:none;"></div>
  <div id="f1" style="display:none;"></div>
  <div id="f2" style="display:none;"></div>

  <!-- RIGHT SIDE SCOREBOARD PANEL -->
  <div id="scorePanel">
    <div class="panel-content">
      <div id="panelHeader">
        <div id="panelTitle">🟠 LIVE SCOREBOARD</div>
        <div id="liveIndicator">
          <div id="liveDot"></div>
          LIVE
        </div>
      </div>

      <!-- 3 Columns: TEAM | KILLS | ALIVE (hidden — baked in graphic) -->
      <div id="colHeaders">
        <div class="col-hdr name">TEAM</div>
        <div class="col-hdr">KILLS</div>
        <div class="col-hdr">ALIVE</div>
      </div>

      <div id="teamList"></div>
    </div>

    <!-- Overall Standings header overlay (TEAM | TOTAL | RANK) -->
    <div id="standingsHeaders">
      <div class="standings-hdr name">TEAM</div>
      <div class="standings-hdr">TOTAL</div>
      <div class="standings-hdr">RANK</div>
    </div>

    <div id="panelFooter">
      <div id="aliveCountContainer">
        <span class="footer-label"><span class="footer-icon">✓</span> ALIVE</span>
        <span id="aliveCount">—</span>
      </div>
      <div id="elimCountContainer">
        <span class="footer-label"><span class="footer-icon">X</span> ELIMINATED</span>
        <span id="elimCount">—</span>
      </div>
    </div>
  </div>

  <!-- ELIMINATION BANNER POPUP (Centre Screen) -->
  <div id="elimPopup">
    <div id="elimPopupBox">
      <div id="elimPopupLabel">Team Eliminated</div>
      <div id="elimPopupTeam">TEAM NAME</div>
      <div id="elimPopupSub">TOTAL KILLS: 0</div>
    </div>
  </div>

</body>
</html>
