<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Points Table</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet"/>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
      font-family: 'Rajdhani', sans-serif;
    }

    #pointsPanel {
      position: absolute;
      top: 0; left: 0;
      width: 1920px; height: 1080px;
      opacity: 0;
      pointer-events: none;
      background: url('/media/points_table_bg.jpg') no-repeat;
      background-size: 1920px 1080px;
    }

    /* Positioned over the lower brownish area of the OBS layout */
    #tableWrapper {
      position: absolute;
      top: 520px;
      left: 25px;
      width: 1870px;
      height: 496px; /* 8 rows * 62px = 496px */
      display: flex;
      flex-direction: column;
    }

    /* ── Dual column header (absolutely positioned above the box) ── */
    #tableHeader {
      position: absolute;
      top: 485px;
      left: 25px;
      width: 1870px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 10px;
      z-index: 10;
    }

    .hdr-half {
      display: grid;
      grid-template-columns: 80px 1fr 120px 120px;
      padding: 0 24px;
      height: 30px;
      align-items: center;
    }

    .hdr-cell {
      font-family: 'Orbitron', sans-serif;
      font-size: 15px;
      font-weight: 900;
      color: #ff8c00;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .hdr-cell.center { text-align: center; }

    /* ── Two-column team grid ── */
    #teamColumns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 10px;
      flex: 1;
      overflow: hidden;
    }

    .team-col {
      display: flex;
      flex-direction: column;
      height: 100%;
      justify-content: space-between;
    }

    /* ── Team Row ── */
    .pt-row {
      display: grid;
      grid-template-columns: 80px 1fr 120px 120px;
      align-items: center;
      height: 62px;
      padding: 0 24px;
      opacity: 0;
      transform: translateX(-40px);
      position: relative;
    }

    /* Subtle row backgrounds/overlays for top 3 */
    .pt-row.rank-1 { background: rgba(255,215,0,0.05) !important; }
    .pt-row.rank-2 { background: rgba(192,192,192,0.04) !important; }
    .pt-row.rank-3 { background: rgba(205,127,50,0.04) !important; }

    .pt-row.rank-1::before,
    .pt-row.rank-2::before,
    .pt-row.rank-3::before {
      content: '';
      position: absolute;
      left: 0; top: 0;
      width: 3px; height: 100%;
    }
    .pt-row.rank-1::before { background: #ffd700; box-shadow: 0 0 8px #ffd700; }
    .pt-row.rank-2::before { background: #c0c0c0; box-shadow: 0 0 8px #c0c0c0; }
    .pt-row.rank-3::before { background: #cd7f32; box-shadow: 0 0 8px #cd7f32; }

    .rank-num {
      font-family: 'Orbitron', sans-serif;
      font-size: 17px;
      font-weight: 900;
      text-align: center;
      color: rgba(255,255,255,0.7);
      letter-spacing: 1px;
    }
    .pt-row.rank-1 .rank-num { color: #ffd700; text-shadow: 0 0 8px rgba(255,215,0,0.8); font-size: 21px; }
    .pt-row.rank-2 .rank-num { color: #c0c0c0; text-shadow: 0 0 8px rgba(192,192,192,0.8); font-size: 19px; }
    .pt-row.rank-3 .rank-num { color: #cd7f32; text-shadow: 0 0 8px rgba(205,127,50,0.8); font-size: 19px; }

    .team-name {
      font-size: 19px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding-left: 15px;
      letter-spacing: 0.5px;
    }
    .pt-row.rank-1 .team-name { color: #fff5c0; font-size: 21px; }
    .pt-row.rank-2 .team-name { color: #e8e8e8; }
    .pt-row.rank-3 .team-name { color: #f5deb3; }

    .kills-val {
      font-family: 'Orbitron', sans-serif;
      font-size: 19px;
      font-weight: 700;
      text-align: center;
      color: #ffc107;
      text-shadow: 0 0 8px rgba(255,193,7,0.4);
    }

    .points-val {
      font-family: 'Orbitron', sans-serif;
      font-size: 21px;
      font-weight: 900;
      text-align: center;
      color: #ff8c00;
      text-shadow: 0 0 10px rgba(255,140,0,0.6);
    }
    .pt-row.rank-1 .points-val { color: #ffd700; text-shadow: 0 0 12px rgba(255,215,0,0.7); font-size: 23px; }
  </style>

  <script>
    const REFRESH_MS = 5000;
    const PAGE_DURATION = 10000; // 10 seconds per page
    let refreshTimer = null;
    let pageTimer = null;
    let isRunning = false;
    let isInitialized = false;

    let allTeams = [];
    let currentIndex = 0;

    function e(id) { return document.getElementById(id); }

    function update(data) {
      const d = typeof data === 'string' ? JSON.parse(data) : data;
      for (const k in d) { const el = document.getElementById(k); if (el) el.innerText = d[k] || ''; }
      if (typeof runTemplateUpdate === 'function') runTemplateUpdate();
    }

    function play() { runTemplateUpdate(); }
    function stop() { hidePanel(); }

    function extractSheetId(url) {
      if (!url) return '';
      const m = url.match(/\/d\/(?!e\/)([a-zA-Z0-9-_]+)/);
      return m ? m[1] : '';
    }

    function extractGid(url) {
      if (!url) return '0';
      const m = url.match(/gid=([0-9]+)/);
      return m ? m[1] : '0';
    }

    function cleanUrl(url) {
      if (!url) return '';
      url = url.trim().replace(/&amp;/g, '&');
      if (url.includes('/pubhtml')) {
        return url.split('/pubhtml')[0] + '/pub?output=csv&gid=' + extractGid(url);
      }
      return url;
    }

    function isValidTeam(name) {
      if (!name || typeof name !== 'string') return false;
      const t = name.replace(/^["']|["']$/g, '').trim();
      if (t.length < 2 || t.length > 40) return false;
      const l = t.toLowerCase();
      if (['teams','team name','teamname','team','status','kills','alive','position','points','rank','#','total','total points'].includes(l)) return false;
      if (t.includes('{') || t.includes('=') || t.includes('<') || l.includes('function') || l.includes('null') || l.includes('return')) return false;
      return true;
    }

    function parseCSV(text) {
      return text.split(/\r\n|\n/).map(line => {
        const result = []; let inQ = false; let cur = '';
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (ch === '"') { inQ = !inQ; }
          else if (ch === ',' && !inQ) { result.push(cur.trim()); cur = ''; }
          else { cur += ch; }
        }
        result.push(cur.trim());
        return result;
      });
    }

    async function fetchCsv(rawUrl) {
      if (!rawUrl) return '';
      const sheetId = extractSheetId(rawUrl);
      const gid     = extractGid(rawUrl);
      let text = '';

      if (sheetId) {
        try {
          const res = await fetch('/api/fetchUrl?url=' + encodeURIComponent(`https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=${gid}`));
          if (res.ok) { const t = await res.text(); if (t && !t.startsWith('<!DOCTYPE') && !t.startsWith('<html')) text = t; }
        } catch(err) {}
      }
      if (!text) {
        try {
          const res = await fetch('/api/fetchUrl?url=' + encodeURIComponent(cleanUrl(rawUrl)));
          if (res.ok) text = await res.text();
        } catch(err) {}
      }
      if (!text || text.startsWith('<!DOCTYPE') || text.startsWith('<html')) return '';
      return text;
    }

    async function runTemplateUpdate() {
      const csvUrl = e('f0') ? e('f0').innerText.trim() : '';
      if (isRunning) { await fetchAndRender(csvUrl, false); return; }
      isRunning = true;
      currentIndex = 0;
      await fetchAndRender(csvUrl, true);
      isInitialized = true;
      showPanel();
      scheduleRefresh(csvUrl);
      startPageRotation();
    }

    function scheduleRefresh(url) {
      if (!isRunning) return;
      refreshTimer = setTimeout(async () => {
        if (!isRunning) return;
        await fetchAndRender(url, false);
        scheduleRefresh(url);
      }, REFRESH_MS);
    }

    function startPageRotation() {
      clearInterval(pageTimer);
      pageTimer = setInterval(() => {
        showNextPage();
      }, PAGE_DURATION);
    }

    function showNextPage() {
      if (allTeams.length <= 15) return; // No pagination if 15 or fewer teams
      currentIndex += 15;
      if (currentIndex >= allTeams.length) {
        currentIndex = 0;
      }
      renderCurrentPage(true);
    }

    async function fetchAndRender(csvUrl, isFirst) {
      try {
        const text = await fetchCsv(csvUrl);
        if (!text) { console.warn('Points Table: no CSV'); return; }

        const rows = parseCSV(text);

        let headerRow = null;
        for (const row of rows) {
          if (!row || row.length < 2) continue;
          if (row.some(c => ['team','teams','team name'].includes(c.toLowerCase().trim()))) { headerRow = row; break; }
        }

        let teamIdx = 1, killsIdx = -1, pointsIdx = -1;
        if (headerRow) {
          headerRow.forEach((c, i) => {
            const l = c.toLowerCase().trim();
            if (['team','teams','team name','teamname'].includes(l)) teamIdx = i;
            else if (['kills','kill'].includes(l)) killsIdx = i;
            else if (l.includes('total') && !l.includes('kill') && !l.includes('match')) pointsIdx = i;
            else if (['points','pts'].includes(l) && pointsIdx < 0) pointsIdx = i;
          });
        }

        const teams = [];
        for (const row of rows) {
          if (!row || row.length < 2) continue;
          const name = (row[teamIdx] || '').trim();
          if (!isValidTeam(name)) continue;
          const kills  = killsIdx  >= 0 ? (parseInt(row[killsIdx]  || '0', 10) || 0) : 0;
          const points = pointsIdx >= 0 ? (parseInt(row[pointsIdx] || '0', 10) || 0) : 0;
          teams.push({ name, kills, points });
        }

        if (teams.length === 0) return;

        teams.sort((a, b) => b.points !== a.points ? b.points - a.points : b.kills - a.kills);
        teams.forEach((t, i) => t.rank = i + 1);
        allTeams = teams;

        renderCurrentPage(isFirst);
      } catch(err) { console.error('Points Table:', err); }
    }

    function renderCurrentPage(animate) {
      e('colLeft').innerHTML  = '';
      e('colRight').innerHTML = '';

      const leftTeams = allTeams.slice(currentIndex, currentIndex + 8);
      const rightTeams = allTeams.slice(currentIndex + 8, currentIndex + 15);

      leftTeams.forEach(t  => e('colLeft').appendChild(buildRow(t)));
      rightTeams.forEach(t => e('colRight').appendChild(buildRow(t)));

      if (animate) {
        // Staggered run-down: rows slide in sequentially
        anime({
          targets:    '.pt-row',
          opacity:    [0, 1],
          translateX: ['-40px', '0px'],
          duration:   380,
          delay:      anime.stagger(40, { start: 80 }),
          easing:     'easeOutCubic'
        });
      } else {
        document.querySelectorAll('.pt-row').forEach(r => {
          r.style.opacity   = '1';
          r.style.transform = 'translateX(0)';
        });
      }
    }

    function buildRow(t) {
      const row = document.createElement('div');
      row.className = 'pt-row' + (t.rank <= 3 ? ' rank-' + t.rank : '');
      row.id = 'ptrow_' + t.rank;
      const medal = t.rank === 1 ? '🥇' : t.rank === 2 ? '🥈' : t.rank === 3 ? '🥉' : '#' + t.rank;
      row.innerHTML = `
        <div class="rank-num">${medal}</div>
        <div class="team-name" title="${t.name}">${t.name}</div>
        <div class="kills-val">${t.kills}</div>
        <div class="points-val">${t.points}</div>
      `;
      return row;
    }

    function showPanel() {
      anime({ targets: '#pointsPanel', opacity: [0, 1], duration: 600, easing: 'easeOutCubic' });
    }

    function hidePanel() {
      clearTimeout(refreshTimer);
      clearInterval(pageTimer);
      isRunning = false; isInitialized = false;
      anime({ targets: '#pointsPanel', opacity: [1, 0], duration: 400, easing: 'easeInCubic' });
    }

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => { if (!isInitialized) runTemplateUpdate(); }, 300);
    });

    window.SPXGCTemplateDefinition = {
      "description": "Points Table – Top 20 (Rank | Team | Kills | Points)",
      "playserver":  "OVERLAY",
      "playchannel": "1",
      "playlayer":   "3",
      "webplayout":  "3",
      "out":         "manual",
      "DataFields": [
        {
          "field": "f0",
          "ftype": "textfield",
          "title": "Google Sheet CSV URL (TotalPoints tab)",
          "value": "https://docs.google.com/spreadsheets/d/1Lm61yqAgEFZRIOQxlsK_27s7B77vtOiYk9g_Uq-EZ_8/edit?pli=1&gid=785807032#gid=785807032"
        }
      ]
    };
  </script>
</head>
<body>

  <div id="f0" style="display:none;"></div>

  <div id="pointsPanel">
    <!-- Dual column headers positioned absolutely above the wrapper -->
    <div id="tableHeader">
      <div class="hdr-half">
        <div class="hdr-cell center">#</div>
        <div class="hdr-cell">TEAM NAME</div>
        <div class="hdr-cell center">KILLS</div>
        <div class="hdr-cell center">POINTS</div>
      </div>
      <div class="hdr-half">
        <div class="hdr-cell center">#</div>
        <div class="hdr-cell">TEAM NAME</div>
        <div class="hdr-cell center">KILLS</div>
        <div class="hdr-cell center">POINTS</div>
      </div>
    </div>

    <div id="tableWrapper">
      <!-- Team columns -->
      <div id="teamColumns">
        <div class="team-col" id="colLeft"></div>
        <div class="team-col" id="colRight"></div>
      </div>
    </div>
  </div>

</body>
</html>
